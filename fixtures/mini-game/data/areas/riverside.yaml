# 河畔区域（AreaDef，设计 §2.4 / FR-XPLR-01/02）
#
# 旧镇下游的河岸地带：渡口、渔市、货栈、河堤。与 old_town 由渡口相连
# （跳转入口见 scenes/old_town/town_gate.yaml 的 go_riverside 选项）。
id: riverside
nameKey: areas.riverside.name
locations:
  ferry:
    nameKey: areas.riverside.ferry
    moveCost: 1
    mapPos: [320, 140]
    entryScene: riverside_ferry
  fish_market:
    nameKey: areas.riverside.fish_market
    moveCost: 1
    mapPos: [420, 180]
    entryScene: riverside_fish_market
  warehouse:
    nameKey: areas.riverside.warehouse
    unlockIf: 'flag.ferryman_met || flag.warehouse_open'
    moveCost: 2
    mapPos: [500, 120]
    entryScene: riverside_warehouse
  embankment:
    nameKey: areas.riverside.embankment
    unlockIf: 'attr.insight >= 3'
    moveCost: 1
    mapPos: [380, 240]
    entryScene: riverside_embankment
