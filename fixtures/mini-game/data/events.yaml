# 事件池（EventDef，设计 §2.4 / FR-XPLR）：condition 型与 random 型各 1 条
- id: ev_wall_whisper
  where:
    area: old_town
    location: gate
  when:
    slots: [evening, night]
  trigger:
    type: condition
    # 约束 8「设计对账」：npc.<id>.met 在引擎中只读且从不为真（无写入口），
    # 故改用 flag 域表达「已遇见」（设计 §3.3 指定的 NPC 记忆机制）。
    require: '!flag.wall_rubbing_taken && flag.old_guard_met'
  priority: 10
  mutexGroup: wall_line
  tags: [general]
  scene: ev_wall_whisper_scene
- id: ev_market_rumor
  where:
    area: old_town
    location: market
  when:
    slots: [morning, afternoon]
  trigger:
    type: random
    weight: 5
    require: '!flag.heard_rumor'
    cooldown:
      days: 2
    once: save
  priority: 0
  tags: [general]
  scene: ev_market_rumor_scene
# —— 河畔区域事件（M1 收尾扩充：覆盖 condition / random / explore 三型）——
- id: ev_ferry_greeting
  where:
    area: riverside
    location: ferry
  when:
    slots: [morning, afternoon, evening]
  trigger:
    type: condition
    require: 'flag.ferryman_met && !flag.ferry_greeted'
  priority: 8
  mutexGroup: ferry_line
  tags: [general]
  scene: ev_ferry_greeting_scene
- id: ev_fish_market_bargain
  where:
    area: riverside
    location: fish_market
  when:
    slots: [morning, afternoon]
  trigger:
    type: random
    weight: 4
    require: 'wallet.town_silver >= 10'
    cooldown:
      days: 1
    once: save
  priority: 0
  tags: [general]
  scene: ev_fish_market_bargain_scene
- id: ev_embankment_find
  where:
    area: riverside
    location: embankment
  when:
    slots: [evening, night]
  trigger:
    type: explore
    weight: 6
    require: 'attr.insight >= 3 && !flag.embankment_found'
    once: loop
  priority: 5
  tags: [general]
  scene: ev_embankment_find_scene
# —— 山丘区域事件（M1 收尾：第 2 条任务线 hillside_survey 的现场事件）——
- id: ev_quarry_echo
  where:
    area: hillside
    location: quarry
  when:
    slots: [morning, afternoon]
  trigger:
    type: explore
    weight: 5
    require: 'attr.insight >= 4 && !flag.quarry_echo_seen'
    once: loop
  priority: 4
  tags: [general]
  scene: ev_quarry_echo_scene
- id: ev_shrine_dream
  where:
    area: hillside
    location: shrine
  when:
    slots: [night]
  trigger:
    type: condition
    require: 'flag.shrine_marked && !flag.shrine_dream_seen'
  priority: 9
  mutexGroup: shrine_line
  tags: [general]
  scene: ev_shrine_dream_scene
- id: ev_trail_wanderer
  where:
    area: hillside
  when:
    slots: [evening]
  trigger:
    type: random
    weight: 3
    require: 'flag.ferryman_met'
    cooldown:
      days: 3
  priority: 0
  tags: [general]
  scene: ev_trail_wanderer_scene
# —— old_town 补充事件（M1 收尾：使事件池达 10+ 条）——
- id: ev_market_gossip
  where:
    area: old_town
    location: market
  when:
    slots: [afternoon, evening]
  trigger:
    type: random
    weight: 4
    require: '!flag.heard_riverside'
    cooldown:
      days: 2
  priority: 0
  tags: [general]
  scene: ev_market_gossip_scene
- id: ev_night_lantern
  where:
    area: old_town
    location: market
  when:
    slots: [night]
  trigger:
    type: random
    weight: 3
    require: '!flag.lantern_followed'
    once: save
  priority: 1
  tags: [general]
  scene: ev_night_lantern_scene
