# 河畔入口场景：渡口（DD-02：一场景一文件）
#
# 由 old_town 的 town_gate 选项跳转进入（跨区域衔接）。含条件段落（首次/再次）
# 与一次性选项示例（08 号叙事宏能力演示）。
id: riverside_ferry
area: riverside
segments:
  - key: scenes.riverside_ferry.arrive
  - key: scenes.riverside_ferry.ferryman
    showIf: '!flag.ferryman_met'
  - key: scenes.riverside_ferry.ferryman_seen
    showIf: 'flag.ferryman_met'
  - key: scenes.riverside_ferry.tide
    showIf: "time.slot == 'evening' || time.slot == 'night'"
choices:
  - id: talk_ferryman
    textKey: scenes.riverside_ferry.choice.talk
    showIf: '!flag.ferryman_met'
    effects:
      # `set` 只接受 attr/flag/counter 标量域与 npc.<id>.flags.<名>（引擎 §3.3）。
      # 故「已遇见」用 flag 域表达（设计 §3.3 指定的 NPC 记忆机制）：
      # 场景段落与事件条件的 showIf/require 一律读同一 flag。
      - flag: { name: 'ferryman_met' }
      # 任务接取（2026-09-15 连通性修复）：摆渡人是 hillside_survey 的 giver。
      # acceptIf 为 flag.ferryman_met && insight>=3 → 搭话后该 flag 已置，
      # insight 不足时 accept 被拒（引擎拒绝原因可读，符合 §4.5 校验语义）。
      - quest: { id: hillside_survey, action: accept }
      - notify: { textKey: 'scenes.riverside_ferry.notify.met' }
  - id: ask_ferry
    textKey: scenes.riverside_ferry.choice.ask_ferry
    showIf: 'flag.ferryman_met'
    once: true
    effects:
      - add: { key: 'attr.insight', amount: 1 }
      - notify: { textKey: 'scenes.riverside_ferry.notify.ferry_tip' }
  - id: to_fish_market
    textKey: scenes.riverside_ferry.choice.to_market
    goto: riverside_fish_market
  - id: to_embankment
    textKey: scenes.riverside_ferry.choice.to_embankment
    showIf: 'attr.insight >= 3'
    goto: riverside_embankment
  - id: back_town
    textKey: scenes.riverside_ferry.choice.back
    goto: town_gate
