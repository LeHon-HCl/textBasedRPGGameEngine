# 镇口：考察选项（效果 + 条件）与回跳选项；徽记线索与任务「墙中徽记」联动
id: town_gate
area: old_town
segments:
  - key: scenes.town_gate.guard
  - key: scenes.town_gate.wall
choices:
  # 与老卫兵搭话（2026-09-15 补）：此前 ev_wall_whisper 的 require 读
  # `flag.old_guard_met`，而全包**没有任何写入口**——该事件永不触发（约束 7 的
  # C9「幽灵 flag」检抓出）。同时在 npc 记忆域记 `talked`，供 wall_rubbing 第 2
  # 阶段 completeWhen（`npc.old_guard.talked`）推进。
  - id: greet_guard
    textKey: scenes.town_gate.choice.greet_guard
    showIf: '!flag.old_guard_met'
    effects:
      - flag: { name: 'old_guard_met' }
      - set: { key: 'npc.old_guard.flags.talked', value: true }
      - notify: { textKey: 'scenes.town_gate.notify.guard_met' }
  - id: inspect_wall
    textKey: scenes.town_gate.choice.inspect_wall
    showIf: 'attr.insight >= 2'
    # 一次性（§4.2「once 选项」）：辨认徽记是「看过就完了」的动作，且其效果含
    # `quest: accept`——重复触发会被任务状态机合法拒绝（active→active 非 accept
    # 触发）。加 once 后选过即隐藏，与同夹具 survey/mark_shrine 的守卫口径一致。
    once: true
    effects:
      - add: { key: 'attr.insight', amount: 2 }
      # 任务接取（2026-09-15 连通性修复：此前无任何 accept 调用点，两条任务线
      # 永远停在 undiscovered。wall_rubbing 的 acceptIf 为 flag.heard_rumor，
      # 集市「听传闻」后此处即可接取——剧情因果：听到传闻 → 来镇口辨认徽记）
      - quest: { id: wall_rubbing, action: accept }
  # 任务提交（2026-09-15 补；约束 7 的 C11 检抓出）：六态机里
  # `ready_to_submit → done` 是**唯一结算 rewards 的路径**，只能由 quest:complete
  # 触发。此前全包只有 accept 调用点 → 任务停在「待提交」，20 银与老卫兵好感
  # 永远发不出。showIf 与「可提交」同口径（quest() 未开始时返回 undefined，
  # 安全），故不可提交时不出现——不会出现「可点但必失败」的选项。
  - id: report_rubbing
    textKey: scenes.town_gate.choice.report_rubbing
    showIf: "quest('wall_rubbing') == 'ready_to_submit'"
    effects:
      - quest: { id: wall_rubbing, action: complete }
      - notify: { textKey: 'scenes.town_gate.notify.reported' }
  - id: back_market
    textKey: scenes.town_gate.choice.back_market
    goto: market_street
  # 跨区域衔接：出镇门即到河畔渡口（M1 收尾·多区域探索）。
  # `unlock: area` 使河畔出现在地图上（FR-XPLR-01；2026-09-15 新增的写入口）——
  # 地图默认只显示已解锁区域，此前无任何运行期解锁路径，河畔/山丘恒不显示。
  - id: go_riverside
    textKey: scenes.town_gate.choice.go_riverside
    effects:
      - unlock: { kind: area, id: riverside }
      - goto: riverside_ferry
  # 结局入口（2026-09-15 连通性修复）：此前 quiet_town 无任何触发点。
  # 语义：在镇口选择「就此离开」→ 置 left_town（endings.reachWhen 的条件之一），
  # 满足时间条件（day ≥ 7）时达成结局；未满足时也不阻断（flag 已置，日后再来）。
  - id: leave_town
    textKey: scenes.town_gate.choice.leave_town
    showIf: 'time.day >= 7'
    effects:
      - flag: { name: 'left_town' }
      - ending: quiet_town
