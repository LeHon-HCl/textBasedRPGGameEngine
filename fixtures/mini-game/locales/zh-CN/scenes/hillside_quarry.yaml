desc: 采石场的断壁围出半个圈，凿痕在石面上密得像鳞。
tracks: 地上有一道新鲜的拖痕，直通向塌了一半的料棚。
surveyed: 你量过凿痕的走向，心里大致有了数。
notify:
  rats_cleared: 岩鼠被赶走了，采石场安静下来。
  rats_defeat: 你狼狈地退回了山道口。
  rats_escaped: 你退出了战斗，岩鼠们警惕地盯着你。
  surveyed: 你把凿痕的走向记在心里，和镇上的旧闻对上了。
  rested: 你在背风的石窝里歇了一阵，气力回来了些。
choice:
  fight_rats: 驱赶岩鼠
  survey: 仔细查看凿痕
  rest: 在石窝里歇一歇
  back: 回山道口
